# event_pitch E11 — layer compare at 506 (no spectral warp for pitch)
track: event_pitch
stage: E11
role: dir_506_layer_compare_pilot

peaks:
  manifest: out/stems/Dir/event_sculpt/pass2/lpc_sf_adaptive_on_piano/fusion_kenv_agree_o12db_on_piano_manifest.json
  key: conservative_kenv_agree_only
  expect_n: 506

# Separation layers only — NOT tilt/K-env (those warp spectrum for onset)
layers:
  piano: out/stems/Dir/bs_roformer/piano.wav
  harmonic: out/stems/Dir/event_sculpt/hpss_harmonic.wav
  # percussive: attack cue only — not used as F0 source
  synthesis: out/stems/Dir/event_sculpt/lpc_synthesis.wav

fuse_ro:
  # for tagging rescue vs intersection (not used as pitch source)
  notes_json: src/exp/s5_midi/midi_fuse/out/20260812_midi_fuse_clip_harmonic/notes.json
  tol_s: 0.05

pilot:
  start_s: 30.0
  end_s: 60.0

pitch:
  method: cqt_harmonic_salience
  delay_s: 0.010
  post_s: 0.093
  fmin_hz: 65.41
  fmax_hz: 2093.0
  bins_per_octave: 36
  n_harmonics: 5
  harmonic_decay: 0.6
  fallback_pitch: 60

agree:
  # primary pick rules (in order)
  # 1) piano==harmonic (exact)
  # 2) piano==synthesis
  # 3) harmonic==synthesis
  # 4) piano alone
  octave_ok: true  # treat ±12 as soft agree → prefer lower of pair? use piano pitch

note_off:
  gap_s: 0.01
  max_dur_s: 1.0
  min_dur_s: 0.04

velocity:
  rms_to_vel_min: 40
  rms_to_vel_max: 110
  pre_s: 0.02
  post_s: 0.10
