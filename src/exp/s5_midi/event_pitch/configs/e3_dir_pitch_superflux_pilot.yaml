# event_pitch E3 — frequency-resolved SuperFlux (pitch-axis) @ 506
track: event_pitch
stage: E3
role: dir_506_pitch_superflux_pilot

peaks:
  manifest: out/stems/Dir/event_sculpt/pass2/lpc_sf_adaptive_on_piano/fusion_kenv_agree_o12db_on_piano_manifest.json
  key: conservative_kenv_agree_only
  expect_n: 506

audio:
  path: out/stems/Dir/bs_roformer/piano.wav

pilot:
  start_s: 30.0
  end_s: 60.0

pitch:
  method: pitch_superflux
  # same family as project SuperFlux, but DO NOT sum over frequency
  lag: 2
  max_size: 3
  bins_per_octave: 36
  fmin_hz: 65.41
  fmax_hz: 2093.0
  # average flux over ±half_win frames around onset frame
  half_win_frames: 1
  fallback_pitch: 60

note_off:
  policy: next_onset_cap
  gap_s: 0.01
  max_dur_s: 1.0
  min_dur_s: 0.04

velocity:
  rms_to_vel_min: 40
  rms_to_vel_max: 110
  pre_s: 0.02
  post_s: 0.10
